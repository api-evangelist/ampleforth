name: Ampleforth
description: 'Ampleforth is a decentralized finance (DeFi) protocol behind AMPL, a price-stable
  but supply-elastic cryptocurrency that targets the CPI-adjusted 2019 US dollar by algorithmically
  adjusting token supply (rebasing) across all holders rather than moving price. The ecosystem
  spans the AMPL rebasing token, Wrapped AMPL (WAMPL), the FORTH governance token and DAO, and
  the SPOT inflation-resistant store-of-value protocol built on tranched AMPL collateral. Ampleforth
  is open-source (smart contracts under the fragmentsorg GitHub organization, working name uFragments),
  audited, and deployed on Ethereum with cross-chain support. Surfaced as a portfolio company of
  pantera-capital and enriched in the API Evangelist network from its public docs, GitHub org, blog,
  and community channels; it publishes protocol documentation and an llms.txt but no REST/HTTP API.'
